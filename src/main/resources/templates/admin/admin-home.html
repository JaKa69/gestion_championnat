<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>Accueil - Gestion de Championnat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #333;
        }
        h1 {
            color: #007BFF;
        }
        nav {
            margin-top: 30px;
        }
        nav a {
            display: inline-block;
            margin: 0 15px;
            text-decoration: none;
            color: #007BFF;
            font-weight: bold;
            padding: 10px 20px;
            border: 2px solid #007BFF;
            border-radius: 5px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        nav a:hover {
            background-color: #007BFF;
            color: white;
        }
    </style>
</head>
<body>
<h1>Bienvenue dans la partie admin de notre site de gestion de championnat</h1>

<nav>
    <a th:href="@{/admin/home}">Page Home</a>
    <a class="btn btn-outline-primary" th:href="@{/admin/dashboard}">dashboard admin</a>
    <a th:href="@{/admin/championships}">Liste des Championnats, partie admin</a>
    <a th:href="@{admin/teams}">Partie admin des équipes</a>
    <a th:href="@{'/teams/' + 1}">Informations d’une Équipe (id=1)</a>
</nav>
</body>
</html>
