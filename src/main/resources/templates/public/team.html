<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Fiche équipe</title>
        <meta charset="UTF-8">
    </head>
    <body>
    <div th:replace="~{public/navbar :: navbar}"></div>
    <a th:href="@{/championships/ranking?championshipId=1}">Retour</a>

    <h1 th:text="${team.name}">Nom équipe</h1>

        <p><strong>Entraîneur :</strong> <span th:text="${team.coach}">Nom</span></p>
        <p><strong>Président :</strong> <span th:text="${team.president}">Nom</span></p>
        <p><strong>Pays :</strong> <span th:text="${team.country.name}">France</span></p>
        <p><strong>Stade :</strong> <span th:text="${team.stadium.name}">Parc</span>
            (capacité : <span th:text="${team.stadium.capacity}">40000</span>)
        </p>
        <h2>Historique des matchs</h2>
        <table>
            <thead>
            <tr>
                <th>Adversaire</th>
                <th>Score</th>
                <th>Date</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="match : ${team.getHomeGames()}">
                <td th:text="${match.getTeam2().getName()}">Adversaire</td>
                <td th:text="${match.getTeam1Point()} + '-' + ${match.getTeam2Point()}">2 - 1</td>
                <td th:text="${match.getDay().getNumber()}">01/01/2025</td>
            </tr>
            </tbody>
        </table>
    </body>
</html>
